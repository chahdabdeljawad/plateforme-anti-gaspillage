name: zerogaspi
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  http: 1.6.0
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  video_player: ^2.9.2
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/backgroundgaspi.png
    - assets/hero_animation.mp4
    - assets/how1.png
    - assets/how2.png
    - assets/how3.png
    - assets/how4.png
    - assets/benefit1.png
    - assets/benefit2.png
    - assets/benefit3.png
    - assets/benefit4.png

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
