name: zerogaspi
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  http: 1.6.0
  google_fonts: ^6.1.0

  flutter_localizations:
    sdk: flutter
  intl: any
  video_player: ^2.9.2
  provider: ^6.0.5

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.0.0
  geocoding: ^2.1.0

  carousel_slider: ^5.0.0
  shared_preferences: ^2.2.2

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/backgroundgaspi.png
    - assets/hero_animation.mp4
    - assets/how1.png
    - assets/how2.png
    - assets/how3.png
    - assets/how4.png
    - assets/benefit1.png
    - assets/benefit2.png
    - assets/benefit3.png
    - assets/benefit4.png
    - assets/langue/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/font/PlayfairDisplay-Regular.ttf
        - asset: assets/font/PlayfairDisplay-Bold.ttf
          weight: 700
